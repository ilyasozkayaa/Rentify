services:
  postgres:
    image: postgres:17
    container_name: rentify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentify
      POSTGRES_USER: rentify
      POSTGRES_PASSWORD: rentify_dev_password
    ports:
      - "5432:5432"
    volumes:
      - rentify-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rentify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: rentify-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - rentify-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    container_name: rentify-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: rentify-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rentify_minio
      MINIO_ROOT_PASSWORD: rentify_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rentify-minio-data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: rentify-minio-init
    depends_on:
      - minio
    volumes:
      - ./minio-cors.json:/config/cors.json:ro
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 rentify_minio rentify_minio_dev_password; do sleep 1; done;
      mc mb --ignore-existing local/rentify-images;
      mc cors set local/rentify-images /config/cors.json;
      mc anonymous set none local/rentify-images"

  pgadmin:
    image: dpage/pgadmin4
    container_name: rentify-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rentify.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  rentify-postgres-data:
  rentify-minio-data:
  rentify-elasticsearch-data:
